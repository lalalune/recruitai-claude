<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#83a9ff"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#2b3242" stroke-width="12"/>

  <!--
    A ranked list: bars of descending length, the top one lit, with a signal dot
    marking it. The product's thesis is that ranking beats volume, so the mark is
    the ranking itself rather than a generic briefcase or magnifier.
    Shapes stay chunky and high-contrast so it still reads at 16px.
  -->
  <g transform="translate(206,286)">
    <rect x="0" y="0"   width="500" height="86" rx="43" fill="url(#hot)"/>
    <rect x="0" y="134" width="404" height="86" rx="43" fill="#3d445c"/>
    <rect x="0" y="268" width="300" height="86" rx="43" fill="#333a4e"/>
    <rect x="0" y="402" width="196" height="86" rx="43" fill="#2b3143"/>
    <circle cx="612" cy="43" r="43" fill="#83a9ff"/>
  </g>
</svg>
