appId: com.recruitai.app
productName: recruitAI
copyright: Copyright © 2026 Shaw Walters. Licensed under Apache-2.0.
asar: true

directories:
  output: release
  buildResources: build

# Only the two runtime trees. `dist/**` also swept in dist/tests/*.cjs,
# dist/seed.cjs and dist/smoke.cjs, which are build artifacts of the test
# runner and dev scripts, not the app.
#
# node_modules is excluded on purpose: electron-builder otherwise copies all
# production dependencies into the asar, but nothing in it is reachable at
# runtime — the main process is a single esbuild bundle with only `electron`
# external (provided by the Electron runtime itself), and the renderer is a
# fully bundled Vite build. package.json is always included by electron-builder;
# its `main` points into dist/main.
files:
  - dist/main/**
  - dist/renderer/**
  - "!dist/tests"
  - package.json
  - "!**/*.map"
  - "!node_modules/**"

# Apache-2.0 §4(a) requires recipients of the binaries receive the License, and
# §4(d) requires propagating third-party NOTICE content. Shipping these three
# files alongside the app is how the packaged build satisfies that.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD-PARTY-LICENSES.md
    to: THIRD-PARTY-LICENSES.md

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  # Unsigned. Gatekeeper will quarantine the download; the README documents the
  # one-time `xattr -dr com.apple.quarantine` fix. Signing needs a $99/yr Apple
  # Developer account, which this tool does not justify for a single operator.
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  icon: build/icon.png
  category: Office
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
