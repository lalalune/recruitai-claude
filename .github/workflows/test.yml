name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite and path behavior differ per OS; testing only macOS let
        # separator and keyring assumptions rot unverified.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung Electron harness must fail in minutes, not bill the 6-hour
    # Actions default (the harness's own watchdog fires first; this is the
    # backstop for everything else).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Tests run under Node (node:sqlite, node:test); bun is only the task runner.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The Electron binary is a per-run network download otherwise (bun skips
      # lifecycle scripts, so it fetches lazily INSIDE the first boot test —
      # a download flake then reports as a boot failure, which is bad
      # attribution). Cache it and fetch it in its own step.
      - if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      # Real Electron boot + the primary-loop drive (seeded DB, real keystrokes
      # through Chromium's input pipeline, approval → drainer → draft).
      - if: runner.os == 'macOS'
        run: |
          node node_modules/electron/install.js
          bun run test:boot
          bun run test:loop

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          # bun skips lifecycle scripts, so Electron's binary downloads lazily
          # on first launch — force it NOW so the sandbox helper exists to fix.
          node node_modules/electron/install.js
          # Electron's SUID sandbox helper must be root:4755 on Linux. Fixing
          # ownership keeps the sandbox ENABLED — never --no-sandbox the boot
          # test; a sandboxed boot is part of what it proves.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a bun run test:boot
          xvfb-run -a bun run test:loop
      # Windows: unit/e2e suites cover it; a headed Electron boot (and with it
      # the loop harness's sendInputEvent keyboard drive) is flaky enough on
      # the Windows runner to cost more signal than it adds — which means
      # Windows keyboard dispatch is deliberately not exercised in CI.
