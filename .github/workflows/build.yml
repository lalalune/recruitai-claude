name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: release/*.{dmg,zip}
          - os: windows-latest
            script: dist:win
            artifact: release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: release/*.{AppImage,deb}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Electron bundles its own Node 24 at runtime, but the build scripts and
      # typecheck run on the host toolchain.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run ${{ matrix.script }}
        env:
          # Unsigned builds. Signing would need an Apple Developer account and a
          # Windows code-signing cert; see README for what users see without them.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: recruitai-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
